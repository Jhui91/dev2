# Upstream 설정 - Spring Boot 애플리케이션
upstream spring_boot {
    server 127.0.0.1:8080 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# HTTP 서버 (나중에 HTTPS로 리다이렉트)
server {
    listen 80;
    server_name your-domain.com www.your-domain.com;  # 실제 도메인으로 변경

    # 최대 업로드 크기
    client_max_body_size 50M;

    # 로그 설정
    access_log /var/log/nginx/trading-app-access.log;
    error_log /var/log/nginx/trading-app-error.log warn;

    # 정적 파일 캐싱 (이미지, CSS, JS 등)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg|eot)$ {
        proxy_pass http://spring_boot;
        proxy_cache_valid 200 30d;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Spring Boot 애플리케이션
    location / {
        proxy_pass http://spring_boot;

        # 프록시 헤더
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket 지원
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 타임아웃 설정
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 버퍼 설정
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }

    # Health check 엔드포인트 (선택)
    location /actuator/health {
        proxy_pass http://spring_boot;
        access_log off;
    }

    # 에러 페이지 (선택)
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

